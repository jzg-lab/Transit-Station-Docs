<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc">
  <title id="title">Windows 文件资源管理器显示文件扩展名和隐藏项目</title>
  <desc id="desc">打开查看选项卡，勾选文件扩展名和隐藏的项目。</desc>
  <rect width="720" height="430" fill="#f7f8fa"/>
  <rect x="0" y="0" width="720" height="72" fill="#ffffff"/>
  <rect x="20" y="20" width="42" height="34" rx="4" fill="#0b6fb3"/>
  <text x="82" y="42" font-family="Arial, sans-serif" font-size="18" fill="#333">主页</text>
  <text x="158" y="42" font-family="Arial, sans-serif" font-size="18" fill="#333">共享</text>
  <text x="244" y="42" font-family="Arial, sans-serif" font-size="18" fill="#333">查看</text>
  <rect x="212" y="12" width="118" height="50" fill="none" stroke="#e52626" stroke-width="5"/>
  <rect x="334" y="10" width="100" height="54" fill="#aaf08c"/>
  <text x="365" y="42" font-family="Arial, sans-serif" font-size="16" fill="#285e18">管理</text>
  <rect x="0" y="72" width="720" height="46" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="84" y="101" font-family="Arial, sans-serif" font-size="16" fill="#333">此电脑</text>
  <text x="158" y="101" font-family="Arial, sans-serif" font-size="16" fill="#333">›</text>
  <text x="184" y="101" font-family="Arial, sans-serif" font-size="16" fill="#333">本地磁盘 (C:)</text>
  <rect x="0" y="118" width="210" height="168" fill="#ffffff"/>
  <text x="20" y="152" font-family="Arial, sans-serif" font-size="15" fill="#2f6f9f">快速访问</text>
  <text x="24" y="188" font-family="Arial, sans-serif" font-size="15" fill="#333">▣ 桌面</text>
  <text x="24" y="222" font-family="Arial, sans-serif" font-size="15" fill="#333">▣ 下载</text>
  <text x="24" y="256" font-family="Arial, sans-serif" font-size="15" fill="#333">▣ 文档</text>
  <rect x="210" y="118" width="510" height="168" fill="#fbfbfb"/>
  <text x="300" y="152" font-family="Arial, sans-serif" font-size="15" fill="#555">名称</text>
  <text x="300" y="190" font-family="Arial, sans-serif" font-size="16" fill="#333">📁 $WinREAgent</text>
  <text x="300" y="224" font-family="Arial, sans-serif" font-size="16" fill="#333">📁 123pan</text>
  <text x="300" y="258" font-family="Arial, sans-serif" font-size="16" fill="#333">📁 20250527</text>
  <rect x="0" y="286" width="720" height="144" fill="#eef3f8"/>
  <text x="30" y="324" font-family="Arial, sans-serif" font-size="16" fill="#555">分组依据</text>
  <rect x="292" y="316" width="192" height="72" fill="#ffffff" stroke="#d2d9e1"/>
  <rect x="312" y="332" width="17" height="17" fill="#fff" stroke="#777" stroke-width="2"/>
  <path d="M315 340 L321 346 L328 335" fill="none" stroke="#2b6cb0" stroke-width="3"/>
  <text x="338" y="346" font-family="Arial, sans-serif" font-size="15" fill="#333">文件扩展名</text>
  <rect x="312" y="360" width="17" height="17" fill="#fff" stroke="#777" stroke-width="2"/>
  <path d="M315 368 L321 374 L328 363" fill="none" stroke="#2b6cb0" stroke-width="3"/>
  <text x="338" y="374" font-family="Arial, sans-serif" font-size="15" fill="#333">隐藏的项目</text>
  <rect x="286" y="310" width="214" height="86" fill="none" stroke="#e52626" stroke-width="5"/>
  <text x="520" y="362" font-family="Arial, sans-serif" font-size="16" fill="#555">选项</text>
