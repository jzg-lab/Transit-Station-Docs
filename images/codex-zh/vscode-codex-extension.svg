  <text x="392" y="234" font-family="Arial, sans-serif" font-size="15" fill="#d6d6d6">and edit code faster. Use it side-by-side in your IDE.</text>
  <text x="392" y="302" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#f0f0f0">Pair with Codex</text>
  <text x="392" y="342" font-family="Arial, sans-serif" font-size="14" fill="#cfcfcf">Add Codex as a panel in VS Code to chat, edit, and preview.</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#f03b2f"/>
